[workspace]
resolver = "2"
members = ["crates/rolling-commons-shell"]

[workspace.dependencies]
# Pinned upstream surface. The pinned commit is recorded in
# docs/planning/15-living-qualiadb-capability-ledger.md and docs/adr/0001.
qualia-core-db = { path = "../qualiaDB/crates/qualia-core-db", default-features = false }

# Versions must match the qualiaDB workspace pins (wasm-bindgen is ABI-exact).
wasm-bindgen = "=0.2.125"
js-sys = "0.3.102"
web-sys = "0.3.102"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
