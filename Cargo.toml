[workspace]
resolver = "2"
members = ["crates/rolling-commons-shell", "crates/pack-export"]

[workspace.dependencies]
# Full local QualiaDB engine. The verified checkout revision is recorded in
# docs/planning/15-living-qualiadb-capability-ledger.md and docs/adr/0001.
qualia-core-db = { git = "https://github.com/mediaprophet/qualiaDB.git", branch = "0.0.40.12-etalon-migration", default-features = false }
qualia-geospatial = { git = "https://github.com/mediaprophet/qualiaDB.git", branch = "0.0.40.12-etalon-migration" }
qualia-sim = { git = "https://github.com/mediaprophet/qualiaDB.git", branch = "0.0.40.12-etalon-migration" }

# Versions must match the qualiaDB workspace pins (wasm-bindgen is ABI-exact).
wasm-bindgen = "=0.2.129"
js-sys = "0.3.106"
web-sys = "0.3.106"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

[patch.crates-io]
wgpu = { git = "https://github.com/mediaprophet/etalon.git", branch = "qualiadb-migration" }
naga = { git = "https://github.com/mediaprophet/etalon.git", branch = "qualiadb-migration" }
