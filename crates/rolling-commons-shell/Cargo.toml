[package]
name = "rolling-commons-shell"
version = "0.0.1"
edition = "2021"
publish = false
description = "Maslows Challenge WASM game shell — thin bindings over the full QualiaDB engine"

[lib]
crate-type = ["cdylib", "rlib"]

# wasm32-only crate: the whole lib.rs is cfg'd to wasm32, matching the
# webizen-web pattern. The full QualiaDB WASM engine supplies the renderer,
# geometry, graph/logic, storage, and optional inference capabilities.
[target.'cfg(target_arch = "wasm32")'.dependencies]
qualia-core-db = { workspace = true, features = ["wasm-full"] }
vibe-wasm = { path = "../../../qualiaDB/crates/vibe-wasm" }
vibe = { path = "../../../qualiaDB/crates/vibe" }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4.75"
web-sys = { workspace = true, features = [
    "console", "Window", "Navigator", "Performance", "HtmlCanvasElement",
] }
