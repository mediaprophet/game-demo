[package]
name = "rolling-commons-shell"
version = "0.0.1"
edition = "2021"
publish = false
description = "Maslows Challenge WASM game shell — thin bindings over the full QualiaDB engine"

[lib]
crate-type = ["cdylib", "rlib"]

# wasm32-only crate: the whole lib.rs is cfg'd to wasm32, matching the
# webizen-web pattern. The full QualiaDB WASM engine supplies the renderer,
# geometry, graph/logic, storage, and optional inference capabilities.
[target.'cfg(target_arch = "wasm32")'.dependencies]
qualia-core-db = { workspace = true, features = ["wasm-full"] }
qualia-geospatial = { workspace = true }
qualia-sim = { workspace = true }
vibe-wasm = { git = "https://github.com/mediaprophet/qualiaDB.git", branch = "0.0.40.12-etalon-migration" }
vibe = { git = "https://github.com/mediaprophet/qualiaDB.git", branch = "0.0.40.12-etalon-migration" }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
js-sys = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
sha2 = "0.10"
wasm-bindgen-futures = "0.4.79"
web-sys = { workspace = true, features = [
    "console", "Window", "Navigator", "Performance", "HtmlCanvasElement",
] }
