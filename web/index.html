<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>dev.civics.au — Community Grounds &amp; Regional Corridor (QualiaDB + VibeScript + Ecopunk .10d)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1317; }
    #scene, #hud {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }
    #scene { z-index: 1; }
    #hud { z-index: 2; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <canvas id="hud"></canvas>

  <script type="module">
    const WASM_BUILD = 'ecopunk_v5_native_forge';
    const PRIMARY_ASSETS = [
      'sites/00-talbingo-scene.10d',
      'sites/00-talbingo-water.10d',
      'models/growing-station.10d',
      'models/swamp-wallaby-r1.10d',
      'models/eucalypt-spray.10d',
      'models/corymbia-whole-organism.10d',
      'lab/scale-1-archetype-0-state-0.10d',
      'lab/scale-2-archetype-0-state-1.10d',
      'lab/scale-3-archetype-0-state-1.10d',
      'lab/scale-4-archetype-0-state-1.10d',
      'lab/scale-5-archetype-0-state-1.10d',
    ];
    const SECONDARY_ASSETS = [
      'sites/02-jounama_karst-scene.10d',
      'sites/02-jounama_karst-water.10d',
      'sites/03-yarrangobilly-scene.10d',
      'sites/03-yarrangobilly-water.10d',
      'sites/05-three_mile_dam-scene.10d',
      'sites/05-three_mile_dam-water.10d',
      'sites/06-sydney_sandstone-scene.10d',
      'sites/06-sydney_sandstone-water.10d',
      'sites/07-noosa_headland-scene.10d',
      'sites/07-noosa_headland-water.10d',
      'lab/scale-5-archetype-1-state-1.10d',
      'lab/scale-5-archetype-2-state-1.10d',
      'lab/scale-5-archetype-3-state-1.10d',
      'lab/scale-5-archetype-4-state-1.10d',
    ];

    async function fetchAsset(key) {
      const res = await fetch(`./assets/ecopunk/${key}`);
      if (!res.ok) return null;
      return [key, new Uint8Array(await res.arrayBuffer())];
    }

    const primaryPromise = Promise.all(PRIMARY_ASSETS.map(fetchAsset));
    const mod = await import(`./pkg/rolling_commons_shell.js?v=${WASM_BUILD}`);
    await mod.default({ module_or_path: new URL(`./pkg/rolling_commons_shell_bg.wasm?v=${WASM_BUILD}`, import.meta.url) });
    mod.init_panic_hook_shell();

    const sceneCanvas = document.getElementById('scene');
    const hudCanvas = document.getElementById('hud');

    function syncSize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(320, Math.floor(window.innerWidth * dpr));
      const h = Math.max(240, Math.floor(window.innerHeight * dpr));
      if (sceneCanvas.width !== w || sceneCanvas.height !== h) {
        sceneCanvas.width = w;
        sceneCanvas.height = h;
      }
      if (hudCanvas.width !== window.innerWidth || hudCanvas.height !== window.innerHeight) {
        hudCanvas.width = Math.max(320, window.innerWidth);
        hudCanvas.height = Math.max(240, window.innerHeight);
      }
    }
    syncSize();
    window.addEventListener('resize', syncSize);

    try { await mod.init_webgpu(sceneCanvas); } catch (_) {
      try { mod.init_webgl2(sceneCanvas); } catch (_) {}
    }

    const app = new mod.CivicsExperienceApp(sceneCanvas, hudCanvas);
    for (const pair of await primaryPromise) {
      if (pair) app.admit_prebuilt_asset(pair[0], pair[1]);
    }
    app.activate_initial_scene();
    window.__civicsApp = app;

    Promise.all(SECONDARY_ASSETS.map(fetchAsset)).then(list => {
      for (const pair of list) {
        if (pair) app.admit_prebuilt_asset(pair[0], pair[1]);
      }
    });

    let dragging = false, moved = false, lastX = 0, lastY = 0;
    hudCanvas.addEventListener('pointerdown', e => {
      dragging = true;
      moved = false;
      lastX = e.clientX;
      lastY = e.clientY;
      hudCanvas.setPointerCapture(e.pointerId);
    });
    hudCanvas.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      if (Math.hypot(dx, dy) > 4) moved = true;
      if (moved) {
        app.on_orbit(dx, dy);
        lastX = e.clientX;
        lastY = e.clientY;
      }
    });
    hudCanvas.addEventListener('pointerup', e => {
      if (!dragging) return;
      dragging = false;
      if (!moved) {
        const rect = hudCanvas.getBoundingClientRect();
        app.on_pointer_click(e.clientX - rect.left, e.clientY - rect.top, hudCanvas.width, hudCanvas.height);
      }
    });
    hudCanvas.addEventListener('wheel', e => {
      e.preventDefault();
      app.on_zoom(e.deltaY);
    }, { passive: false });

    window.addEventListener('keydown', e => {
      if (e.keyCode === 9) e.preventDefault();
      app.on_key_down(e.keyCode || 0);
    });
    window.addEventListener('keyup', e => app.on_key_up(e.keyCode || 0));

    let lastTime = performance.now();
    function frame(now) {
      syncSize();
      const dt = Math.min(50, Math.max(1, now - lastTime));
      lastTime = now;
      app.tick(sceneCanvas, dt, hudCanvas.width, hudCanvas.height);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
